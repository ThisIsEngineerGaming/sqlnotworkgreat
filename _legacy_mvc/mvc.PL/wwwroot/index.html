<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Films</title>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; vertical-align: middle; }
    img { height: 60px; }
    form { display: grid; grid-template-columns: 150px 250px; gap: 8px; max-width: 450px; }
    form label { align-self: center; }
    #formTitle { margin-top: 2rem; }
    button { cursor: pointer; }
  </style>
</head>
<body>

<h1>Films</h1>

<table id="filmsTable">
  <thead>
    <tr>
      <th>Photo</th>
      <th>Title</th>
      <th>Director</th>
      <th>Year</th>
      <th>Genre</th>
      <th>Rating</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="filmsBody"></tbody>
</table>

<h2 id="formTitle">Add film</h2>
<form id="filmForm">
  <input type="hidden" id="filmId" value="">

  <label for="title">Title</label>
  <input type="text" id="title" required>

  <label for="director">Director</label>
  <input type="text" id="director" required>

  <label for="releaseYear">Release Year</label>
  <input type="number" id="releaseYear" required>

  <label for="genre">Genre</label>
  <input type="text" id="genre" required>

  <label for="rating">Rating (0-10)</label>
  <input type="number" id="rating" step="0.1" min="0" max="10" required>

  <label for="photoFile">Poster file</label>
  <input type="file" id="photoFile" accept="image/*">

  <div>
    <button type="submit" id="submitBtn">Add</button>
    <button type="button" id="cancelBtn" style="display:none;">Cancel edit</button>
  </div>
</form>

<p id="errorBox" style="color:red;"></p>

<script src="/js/app.js"></script>
</body>
</html>
